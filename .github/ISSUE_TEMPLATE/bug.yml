name: Bug report
description: Report a reproducible problem
body:
  - type: textarea
    id: reproduction
    attributes:
      {
        label: Reproduction steps,
        description: Include version,
        environment,
        expected and actual behavior. Remove secrets.,
      }
    validations: { required: true }
  - type: textarea
    id: evidence
    attributes:
      {
        label: Validation and logs,
        description: Redact credentials and private data.,
      }
