name: modusaas-dev
services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: modusaas
      POSTGRES_PASSWORD: modusaas
      POSTGRES_DB: modusaas
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modusaas -d modusaas"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    build:
      context: .
      target: development
    init: true
    ports: ["127.0.0.1:3000:3000"]
    environment:
      DATABASE_URL: postgresql://modusaas:modusaas@db:5432/modusaas
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Run pnpm setup or set a random 32+ character BETTER_AUTH_SECRET in .env}
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_PRESET: ${NEXT_PUBLIC_PRESET:-standard}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-1025}
    command: ["sh", "-c", "pnpm db:migrate && pnpm dev"]
    depends_on:
      db: { condition: service_healthy }
    volumes: ["uploads:/app/.data/uploads"]
  mailpit:
    image: axllent/mailpit:v1.27
    profiles: ["email"]
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]
  redis:
    image: redis:7-alpine
    profiles: ["cache"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis:/data"]
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: ["storage"]
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-local-development}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local-development-only}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["minio:/data"]
volumes:
  postgres:
  uploads:
  redis:
  minio:
